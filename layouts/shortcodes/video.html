<video controls playsinline preload="none"
       style="display:block; width:100%; max-width:760px; height:auto; object-fit:contain; margin:2rem auto 4rem;"
       {{ with .Get "poster" }}poster="{{ . }}"{{ end }}>
  <source src="{{ .Get "src" }}" type="video/mp4">
  <a href="{{ .Get "src" }}">Download video</a>
</video>
